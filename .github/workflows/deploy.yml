name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ main ] # Change to 'master' if that's your default branch name
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Change to 'pnpm' or 'yarn' if you use those instead

      - name: Install dependencies
        run: npm ci # Use 'npm install' if you don't have a package-lock.json yet

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3 # Updated version compatible with modern GitHub rules
        with:
          path: ./dist # Astro outputs production builds to the 'dist' folder by default

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Modern deployment action
